<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Free Text Combobox – how-to-web</title><link rel="stylesheet" href="./free-text.css"><script src="./free-text.js" defer></script></head><body>
<main class="demo"><p class="eyebrow">Combobox · Free Text Suggestions</p><h1>Suggestions, not a cage.</h1><p>Du kannst einen Vorschlag übernehmen – musst aber nicht. Der eingegebene Text bleibt ein gültiger Wert.</p>
<form data-form><label for="free-input">Describe or choose an object</label><div class="combo"><input id="free-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="free-list" autocomplete="off" placeholder="e.g. something wearable" data-input><ul id="free-list" role="listbox" aria-label="Object suggestions" data-list hidden></ul></div><button type="submit">Use this value</button></form><p class="status" aria-live="polite" data-status></p></main></body></html>
