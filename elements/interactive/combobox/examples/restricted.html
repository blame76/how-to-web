<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restricted Combobox – how-to-web</title><link rel="stylesheet" href="./restricted.css"><script src="./restricted.js" defer></script></head><body>
<main class="demo"><p class="eyebrow">Combobox · Restricted Selection</p><h1>Typing narrows. Selection commits.</h1><p>Hier ist Freitext nur eine Suchquery. Gültig wird das Feld erst, wenn ein vorhandener Wert ausdrücklich übernommen wurde.</p>
<form data-form novalidate><label for="restricted-input">Assign inventory object</label><div class="combo"><input id="restricted-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="restricted-list" aria-describedby="restricted-error" autocomplete="off" placeholder="Start typing an object name" data-input><ul id="restricted-list" role="listbox" aria-label="Inventory objects" data-list hidden></ul></div><p class="error" id="restricted-error" data-error></p><button type="submit">Assign object</button></form><p class="status" aria-live="polite" data-status></p></main></body></html>
