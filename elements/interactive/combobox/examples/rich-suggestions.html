<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rich Suggestions Combobox – how-to-web</title><link rel="stylesheet" href="./rich-suggestions.css"><script src="./rich-suggestions.js" defer></script></head><body>
<main class="demo"><p class="eyebrow">Combobox · Rich Suggestions</p><h1>More context. Same option.</h1><p>Zusatzinformation darf beim Entscheiden helfen. Jede Zeile bleibt trotzdem genau ein auswählbarer Wert – keine Buttons, Links oder Mini-Karten im Listbox-Option.</p>
<form data-form novalidate><label for="rich-input">Find an object</label><div class="combo"><input id="rich-input" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="rich-list" aria-describedby="rich-error" autocomplete="off" placeholder="Search Future Objects" data-input><ul id="rich-list" role="listbox" aria-label="Future Object suggestions" data-list hidden></ul></div><p class="error" id="rich-error" data-error></p><button type="submit">Open object</button></form><p class="status" aria-live="polite" data-status></p></main></body></html>
