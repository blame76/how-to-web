<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compact Product Card – how-to-web</title>
  <link rel="stylesheet" href="./compact.css">
  <script src="./compact.js" defer></script>
</head>
<body>
<main class="example-shell">
  <p class="example-label">Beispiel · Compact</p>
  <div data-product-card>
    <article class="product-card" aria-labelledby="compact-title">
      <div class="product-card__media"><picture><source type="image/avif" srcset="../assets/generated/hoodie-studio-front-480.avif 480w, ../assets/generated/hoodie-studio-front-960.avif 960w" sizes="120px"><source type="image/webp" srcset="../assets/generated/hoodie-studio-front-480.webp 480w, ../assets/generated/hoodie-studio-front-960.webp 960w" sizes="120px"><img src="../assets/generated/hoodie-studio-front-480.webp" alt="Grauer Oversized-Hoodie in frontaler Studioansicht." width="1920" height="1920"></picture></div>
      <div class="product-card__body">
        <p class="product-card__brand">ZERO EIGHT FORTUNE</p>
        <h2 id="compact-title">Lunar Oversized Hoodie</h2>
        <p class="product-card__variation">Moon Grey · XS–XL</p>
        <div class="product-card__footer">
          <strong>89,00 €</strong>
          <a href="https://example.com/products/lunar-oversized-hoodie">Ansehen</a>
        </div>
      </div>
    </article>
  </div>
  <p class="example-note">Demo-Inhalt. Die kompakte Variante reduziert Sekundärinformationen, nicht Semantik.</p>
</main>
</body>
</html>
