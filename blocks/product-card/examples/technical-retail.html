<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Technical Retail Product Card – how-to-web</title>
  <link rel="stylesheet" href="./technical-retail.css">
  <script src="./technical-retail.js" defer></script>
</head>
<body>
<main class="example-shell">
  <p class="example-label">Beispiel · Technical Retail</p>
  <div data-product-card>
    <article class="product-card" aria-labelledby="technical-title">
      <div class="product-card__media">
        <img src="../assets/generated/hoodie-studio-front-960.webp" alt="Grauer Oversized-Hoodie in frontaler Studioansicht." width="1920" height="1920">
      </div>
      <div class="product-card__body">
        <p class="product-card__brand">ZERO EIGHT FORTUNE · ZEF-LUN-01</p>
        <h2 id="technical-title">Lunar Oversized Hoodie</h2>
        <p class="product-card__price">89,00 €</p>
        <dl class="specs">
          <div><dt>Material</dt><dd>480 gsm Heavyweight Cotton</dd></div>
          <div><dt>Fit</dt><dd>Oversized</dd></div>
          <div><dt>Größen</dt><dd>XS–XL</dd></div>
          <div><dt>Farbe</dt><dd>Moon Grey</dd></div>
        </dl>
        <a class="product-card__action" href="https://example.com/products/lunar-oversized-hoodie">Technische Details ansehen</a>
      </div>
    </article>
  </div>
  <p class="example-note">Demo-Inhalt. Technische Produktdaten sind fiktiv und dienen nur der Darstellungsvariante.</p>
</main>
</body>
</html>
