name: Build DNA contract

on:
  pull_request:
    paths:
      - "**/build-dna.json"
      - "**/index.html"
      - "bin/sync-build-dna"
      - ".github/workflows/build-dna.yml"
  push:
    branches:
      - main
    paths:
      - "**/build-dna.json"
      - "**/index.html"
      - "bin/sync-build-dna"
      - ".github/workflows/build-dna.yml"

permissions:
  contents: read

jobs:
  inline-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check inline Build DNA copies
        run: python3 bin/sync-build-dna --check-all
